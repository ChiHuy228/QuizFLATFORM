{% load static %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quiz DOCX{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'quizapp/style.css' %}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><a class="navbar-brand fw-bold" href="{% url 'home' %}">Quiz DOCX</a></div>
</nav>
<main class="container py-5">
  {% for message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
